name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build HTML from README
        run: |
          mkdir -p _site
          cat > _site/index.html <<'OUTER'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>gx – Google Cloud project switcher</title>
            <script src="https://cdn.jsdelivr.net/npm/marked@18.0.0/lib/marked.umd.js"
                    crossorigin="anonymous"></script>
            <style>
              :root { color-scheme: light dark; }
              body {
                max-width: 48rem;
                margin: 2rem auto;
                padding: 0 1rem;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                line-height: 1.6;
                color: #24292f;
                background: #fff;
              }
              @media (prefers-color-scheme: dark) {
                body { color: #c9d1d9; background: #0d1117; }
                a { color: #58a6ff; }
                code, pre { background: #161b22; }
                table, th, td { border-color: #30363d; }
              }
              pre { padding: 1rem; overflow-x: auto; border-radius: 6px; background: #f6f8fa; }
              code { padding: 0.2em 0.4em; border-radius: 3px; background: #f6f8fa; font-size: 0.9em; }
              pre code { padding: 0; background: none; }
              table { border-collapse: collapse; width: 100%; }
              th, td { border: 1px solid #d0d7de; padding: 0.5rem 0.75rem; text-align: left; }
              h1, h2, h3 { margin-top: 1.5em; }
            </style>
          </head>
          <body>
            <div id="content"></div>
            <script>
              fetch('README.md')
                .then(function(r) {
                  if (!r.ok) throw new Error('Failed to load README.md');
                  return r.text();
                })
                .then(function(md) {
                  document.getElementById('content').innerHTML = marked.parse(md);
                })
                .catch(function(err) {
                  var p = document.createElement('p');
                  p.style.color = 'red';
                  p.textContent = 'Error loading page: ' + err.message;
                  document.getElementById('content').appendChild(p);
                });
            </script>
          </body>
          </html>
          OUTER
          # Copy README so it is available as a static asset
          cp README.md _site/README.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
